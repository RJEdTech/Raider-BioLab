*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--div);outline-offset:2px}
.top{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(24px,3.4vw,36px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--ink2);max-width:60ch}
.btn{border:1.5px solid var(--ink);background:var(--panel);border-radius:6px;padding:7px 12px;font-weight:600;font-size:14px}
.btn:hover{background:var(--ink);color:var(--panel)}
.btn.primary{background:var(--ink);color:var(--panel)}
.btn.primary:hover{background:var(--conv);border-color:var(--conv);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px 14px;flex-wrap:wrap}
.tgroup{display:flex;flex-direction:column;gap:4px;min-width:0}
.tgroup>span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.tgroup>div{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font-weight:600;font-size:14px;border-bottom:4px solid var(--tc,var(--line))}
.tab[aria-selected="true"]{background:var(--tc);border-color:var(--tc);color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage{position:relative;aspect-ratio:1000/560;background:var(--sky);overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:8px;bottom:8px;font-family:var(--f-mono);font-size:12px;background:var(--pill);color:var(--pillink);border-radius:6px;padding:6px 9px;max-width:min(300px,60%);line-height:1.45;pointer-events:none}
.hud:empty{display:none}
.meter{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--trans);width:0}
.hs{position:absolute;width:22px;height:22px;transform:translate(-50%,-50%);border:0;background:none;padding:0;z-index:3}
.hs .dot{position:absolute;inset:0;border-radius:50%;background:#fff;border:3px solid var(--conv);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.hs .dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--conv);opacity:.7;animation:pulse 2s ease-out infinite}
.hs.seen .dot{background:var(--conv)}
.hs .lab{position:absolute;left:100%;margin-left:6px;top:50%;transform:translateY(-50%);background:var(--pill);color:var(--pillink);font-size:12px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.hs.ll .lab{left:auto;right:100%;margin-left:0;margin-right:6px}
.hs.lt .lab{left:50%;top:auto;bottom:100%;margin:0 0 8px;transform:translateX(-50%)}
.hs.lb .lab{left:50%;top:100%;margin:8px 0 0;transform:translateX(-50%)}
.hs:hover .lab{background:var(--ink);color:var(--panel)}
@keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.5);opacity:0}}
@media(max-width:640px){.hud{font-size:10px;padding:4px 6px;max-width:70%}.hs .lab{display:none}.hs{width:18px;height:18px}.hs .dot{border-width:2px}}
@media(prefers-reduced-motion:reduce){.hs .dot::after{animation:none}}
.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.controls label{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.controls input[type=range]{width:120px;accent-color:var(--conv)}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 10px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.caption{padding:10px 12px;border-top:1px solid var(--line);font-size:14.5px;min-height:3.4em;background:color-mix(in srgb,var(--panel) 92%,var(--ink))}
.caption b{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 12px;border-top:1px solid var(--line);align-items:center}
.chips>span{font-family:var(--f-mono);font-size:12px;color:var(--ink2);margin-right:4px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px;font-size:13px}
.chip.seen::before{content:"\2713\00a0";color:var(--div);font-weight:700}
.chip:hover{border-color:var(--ink)}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.map{position:relative;background:var(--mapsea)}
.map svg{display:block;width:100%;height:auto}
.mland{fill:var(--land)}
.mb{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mk{cursor:pointer}
.mk circle.c{stroke:#fff;stroke-width:1.6}
.mk.dim{opacity:.4}
.mk text{font-size:10px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px;pointer-events:none}
.mk:focus-visible{outline:none}.mk:focus-visible circle.c{stroke:var(--ink);stroke-width:3}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;padding:8px 12px;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.exh{font-family:var(--f-disp);font-weight:800;font-size:17px;margin:0;padding:12px 12px 4px}
.exl{list-style:none;margin:0;padding:0 8px 10px;display:flex;flex-direction:column;gap:2px}
.exl button{width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px;display:block}
.exl button:hover{background:color-mix(in srgb,var(--panel) 85%,var(--ink))}
.exl strong{display:block;font-size:14px}.exl span{font-size:12.5px;color:var(--ink2)}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,16,20,.45)}
.modal[hidden]{display:none!important}

.sheet.wide{width:min(900px,100%)}
.sheet .k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.sheet h2{font-family:var(--f-disp);font-weight:800;font-size:25px;line-height:1.1;margin:4px 0 10px;text-wrap:balance}
.sheet p{margin:0 0 10px;max-width:65ch}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:12px 0;padding:10px 12px;background:color-mix(in srgb,var(--panel) 90%,var(--ink));border-radius:8px;font-size:14px}
.facts dt{font-family:var(--f-mono);font-size:12px;color:var(--ink2);padding-top:1px}.facts dd{margin:0}
details.q{border:1.5px dashed var(--line);border-radius:8px;padding:8px 12px;margin:10px 0}
details.q summary{cursor:pointer;font-weight:600}

.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:13px;color:var(--ink2)}
.xbtn{float:right;border:0;background:none;font-size:26px;line-height:1;padding:0 4px;color:var(--ink2)}
table.cmp{border-collapse:collapse;font-size:13.5px;min-width:700px;width:100%}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.cmp th{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--ink2)}
.tw{overflow-x:auto}
.svgt{font-family:var(--f-body);font-size:15px;font-weight:600;fill:#fff;paint-order:stroke;stroke:rgba(10,20,26,.7);stroke-width:3.5px}
.svgt.d{fill:#13232b;stroke:rgba(255,255,255,.75)}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Plate Boundary Explorer</h1>
      <p class="sub">Choose a boundary, watch the plates move, and click the pulsing dots to learn what happens and where on Earth it happens.</p>
    </div>
    <button class="btn" id="cmpBtn" type="button">Compare all boundaries</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Boundary type"></nav>
  <main class="layout">
    <section class="card" aria-label="Animated cross-section">
      <div class="stage" id="stage">
        <svg id="svg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Animated diagram of plate motion"></svg>
        <div class="hud" id="hud"></div>
        <div id="hotspots"></div>
      </div>
      <div class="controls" id="controls"></div>
      <div class="caption" id="caption" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
    </section>
    <aside class="side">
      <section class="card" aria-label="World map">
        <div class="map"><svg id="map" viewBox="0 0 1000 400" role="img" aria-label="World map of plate boundaries with example locations"></svg></div>
        <div class="legend"><span><i style="background:var(--conv)"></i>Convergent</span><span><i style="background:var(--div)"></i>Divergent</span><span><i style="background:var(--trans)"></i>Transform</span></div>
      </section>
      <section class="card" aria-label="Examples">
        <h2 class="exh" id="exh">Real examples</h2>
        <ul class="exl" id="exl"></ul>
      </section>
    </aside>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="mt" tabindex="-1"></div></div>

/* ---------- tabs ---------- */
function buildTabs(){
  const nav=$('tabs');nav.setAttribute('role','tablist');
  TABS.forEach(g=>{
    const d=document.createElement('div');d.className='tgroup';
    d.innerHTML='<span>'+g.g+'</span><div></div>';
    g.items.forEach(it=>{
      const b=document.createElement('button');b.type='button';b.className='tab';b.id='tab-'+it.id;b.textContent=it.name;
      b.setAttribute('role','tab');b.style.setProperty('--tc','var('+it.c+')');
      b.onclick=()=>setScene(it.id);d.lastChild.appendChild(b);
    });
    nav.appendChild(d);
  });
}

/* ---------- map ---------- */
function buildMap(){
  const m=$('map');
  E('rect',{width:1000,height:400,fill:'var(--mapsea)'},m);
  E('path',{d:MAP.land,class:'mland'},m);
  E('path',{d:MAP.trans,class:'mb',stroke:'var(--trans)'},m);
  E('path',{d:MAP.div,class:'mb',stroke:'var(--div)'},m);
  E('path',{d:MAP.conv,class:'mb',stroke:'var(--conv)'},m);
  const gm=E('g',{id:'markers'},m);
  Object.keys(EX).forEach(id=>{
    const e=EX[id];const x=(e.lon+180)*1000/360,y=(82-e.lat)*1000/360;
    const g=E('g',{class:'mk',id:'mk-'+id,tabindex:0,role:'button','aria-label':e.name+', '+e.place,transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+')'},gm);
    E('circle',{class:'halo',r:14,fill:'var('+TYPEVAR[TYPE[e.scene]]+')',opacity:0},g);
    E('circle',{class:'c',r:8,fill:'var('+TYPEVAR[TYPE[e.scene]]+')'},g);
    const tx=E('text',{x:11,y:4,opacity:0},g);tx.textContent=e.name;
    g.onclick=()=>openExample(id,g);
    g.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openExample(id,g)}};
  });
}
function refreshMap(){
  Object.keys(EX).forEach(id=>{
    const g=$('mk-'+id),e=EX[id];
    const on=e.scene===S.scene;
    g.classList.toggle('dim',!on);
    const cur=S.example===id;

    g.querySelector('.halo').setAttribute('opacity',cur?.45:0);
    g.querySelector('.c').setAttribute('r',cur?11:8);

}

function compare(){
  const rows=[
   ['Oceanic–oceanic convergent','Denser oceanic plate sinks under another oceanic plate','Deep trench, island arc, explosive volcanoes, megathrust quakes, tsunamis','Mariana, Aleutians, Japan, Tonga'],
   ['Continental–oceanic convergent','Oceanic plate sinks under continent','Trench, coastal mountains, volcanic arc, megathrust quakes, tsunamis','Andes, Cascadia'],
   ['Continental–continental convergent','Neither plate sinks; crust crumples and thickens','Huge mountain belts and plateaus, thrust quakes, almost no volcanoes','Himalaya, Alps, Zagros'],
   ['Divergent (ocean ridge)','Plates pull apart; mantle melts and makes new crust','Mid-ocean ridge, rift valley, magnetic stripes, vents, small quakes','Mid-Atlantic Ridge, Iceland, East Pacific Rise'],
   ['Divergent (continental rift)','Continent stretches and thins, may split','Rift valley, normal faults, lakes, rift volcanoes','East African Rift, Red Sea'],
   ['Transform','Plates slide sideways past each other','Long fault, offset streams and roads, shallow strong quakes, no volcanoes','San Andreas, North Anatolian, Alpine']];
  let h='<div class="tw"><table class="cmp"><thead><tr><th>Boundary</th><th>Plate motion</th><th>Landforms and hazards</th><th>Examples</th></tr></thead><tbody>';
  rows.forEach(r=>{h+='<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>'});

  openPop({k:'Summary',title:'Compare the boundaries',html:h,wide:true},$('cmpBtn'),null);
}

function arrow(p,x1,x2,y,label,dark){
  const dir=Math.sign(x2-x1),g=E('g',null,p),s='rgba(10,20,26,.6)';
  E('path',{d:'M'+x1+' '+y+'L'+(x2-dir*14)+' '+y,stroke:'#fff',fill:'none','stroke-width':6,'stroke-linecap':'round'},g);
  E('path',{d:'M'+(x2-dir*18)+' '+(y-10)+'L'+x2+' '+y+'L'+(x2-dir*18)+' '+(y+10)+'Z',fill:'#fff',stroke:s,'stroke-width':1.5},g);
  const t=E('text',{x:(x1+x2)/2,y:y-14,'text-anchor':'middle',class:'svgt'+(dark?' d':'')},g);t.textContent=label;return g;
}
function buildSub(world,api,cfg){
  const SL=150,id=cfg.id,ramp=u=>(Math.sqrt(u*u+cfg.c*cfg.c)+u)/2;
  addDefs(world,id);
  // slab geometry
  const top=[],bot=[],cb=[],cen=[];
  for(let x=-20;x<=1100;x+=4){
    const yc=cfg.flatTop+cfg.w/2+cfg.slope*ramp(x-cfg.xb);
    const m=cfg.slope*((x-cfg.xb)/Math.sqrt((x-cfg.xb)**2+cfg.c**2)+1)/2,n=Math.sqrt(1+m*m),nx=m/n,ny=-1/n,h=cfg.w/2;

  const base=x=>{for(let i=1;i<ctl.length;i++)if(x<=ctl[i][0]){const a=ctl[i-1],b=ctl[i];return lerp(a[1],b[1],sstep(a[0],b[0],x))}return ctl[ctl.length-1][1]};

  const G=[];for(let x=0;x<=1000;x+=5)G.push(ground(x));
  let iQ=0;while(top[iQ][1]<cfg.yb)iQ++;
  // mantle + plates
  E('rect',{x:0,y:SL,width:1000,height:420,fill:'url(#gm'+id+')'},world);
  const plate=[[xP,yP]];for(let x=Math.ceil(xP/5)*5;x<=1000;x+=5)plate.push([x,ground(x)]);
  plate.push([1000,cfg.yb]);for(let i=iQ;i>=iP;i--)plate.push(top[i]);
  const cp=E('clipPath',{id:'cp'+id},world);E('path',{d:pts2d(plate,1)},cp);
  E('path',{d:pts2d(plate,1),fill:'var(--lith)'},world);
  const cr=[];for(let x=Math.floor(xP/5)*5;x<=1000;x+=5){cr.push([x,ground(x)])}

  E('path',{d:pts2d(cr.concat(crb.slice().reverse()),1),fill:cfg.cont?'var(--cont)':'var(--ocean-crust)','clip-path':'url(#cp'+id+')'},world);
  // slab
  E('path',{d:pts2d(top.concat(bot.slice().reverse()),1),fill:'var(--lith-oc)'},world);
  E('path',{d:pts2d(top.concat(cb.slice().reverse()),1),fill:'var(--ocean-crust)'},world);
  const dsh=E('path',{d:pts2d(cen),fill:'none',stroke:'#fff','stroke-opacity':.45,'stroke-width':3,'stroke-dasharray':'3 15','stroke-linecap':'round'},world);
  // volcano plumbing
  const xv=cfg.xv,gv=ground(xv),chY=lerp(gv,cfg.yb,.55);
  E('path',{d:'M'+xv+' '+(gv+6)+'L'+xv+' '+chY,stroke:'var(--magma)','stroke-width':5,opacity:.85},world);
  const ch=E('ellipse',{cx:xv,cy:chY,rx:44,ry:17,fill:'var(--magma)',opacity:.85},world);
  const crater=E('circle',{cx:xv,cy:gv,r:6,fill:'var(--magma)'},world);
  // quake dots
  const dots=[];
  for(let i=iP+2;i<top.length-2;i+=2){ if(top[i][1]>535)break;
    const f=rnd(.05,.95),p=[lerp(top[i][0],bot[i][0],f),lerp(top[i][1],bot[i][1],f)];
    const y=p[1],col=y<340?'var(--q1)':y<450?'var(--q2)':'var(--q3)';

  // town

  for(let i=0;i<10;i++)ml.push({e:E('circle',{r:3.6,fill:'var(--magma)',stroke:'#ffd9a0','stroke-width':1,opacity:0},world),l:0,s:0});
  for(let i=0;i<14;i++)ash.push({e:E('circle',{r:5,fill:'var(--ink2)',opacity:0},world),l:0});
  cfg.arrows.forEach(a=>arrow(world,a[0],a[1],a[2],a[3],a[4]));
  const upg=E('g',{opacity:0},world);E('path',{d:'M'+cfg.srcX+' '+(SL+88)+'L'+cfg.srcX+' '+(SL+40),stroke:'var(--q1)','stroke-width':6,fill:'none'},upg);
  E('path',{d:'M'+(cfg.srcX-12)+' '+(SL+48)+'L'+cfg.srcX+' '+(SL+28)+'L'+(cfg.srcX+12)+' '+(SL+48)+'Z',fill:'var(--q1)'},upg);

    T.P.forEach(p=>{p.age+=dt;const gx=ground(clamp(p.x,0,1000)),d=dm(clamp(p.x,0,1000)),v=K*Math.sqrt(d);
      p.v=v;p.d=d;p.land=gx<SL;p.x+=p.dir*Math.max(v,16)*dt;

  }
  function hud(){

    const f=p=>{const m=p.d*40,sp=3.6*Math.sqrt(9.81*m),h=Math.min(12,Math.pow(4000/m,.25));return 'depth '+Math.round(m/10)*10+' m<br>speed '+Math.round(sp)+' km/h · height ≈ '+h.toFixed(1)+' m'};
    api.hud.innerHTML='<b>Landward wave</b><br>'+f(T.P[0])+'<br><b>Seaward wave</b><br>'+f(T.P[1])+'<br><i>Wave heights exaggerated</i>';
  }
  const cap0=cfg.cap;api.caption(cap0[0],cap0[1]);

    update(dt){

 oo:[['1 · Locked, then rupture','The plates have been stuck together. Strain suddenly releases, the overriding plate snaps up and the sea surface above it rises.'],

    },
    action(){},
    controls(c){ctlDiv(c);const l=document.createElement('label');l.innerHTML='Rifting <input type="range" id="rfr" min="0" max="1" step="0.005" aria-label="Rift stage from early to a new sea">';
      const r=l.querySelector('input');r.value=P;r.style.width='200px';r.oninput=()=>{P=+r.value;auto=false;hold=0;draw()};c.appendChild(l)}
  };
}
function ctlDiv(c){
  const d=document.createElement('div');d.className='seg';d.setAttribute('role','group');d.setAttribute('aria-label','Divergent boundary type');
  [['ocean','Ocean ridge'],['rift','Continental rift']].forEach(v=>{const b=document.createElement('button');b.type='button';b.textContent=v[1];b.setAttribute('aria-pressed',S.variant===v[0]);b.onclick=()=>{if(S.variant!==v[0])setScene('div',v[0])};d.appendChild(b)});
  c.appendChild(d);
}
SCENES.div=(w,api)=>S.variant==='rift'?buildRift(w,api):buildRidge(w,api);

function varrow(p,x,y1,y2,label,ly){
  const dir=Math.sign(y2-y1),g=E('g',null,p);
  E('path',{d:'M'+x+' '+y1+'L'+x+' '+(y2-dir*14),stroke:'#fff',fill:'none','stroke-width':7,'stroke-linecap':'round'},g);
  E('path',{d:'M'+(x-11)+' '+(y2-dir*18)+'L'+x+' '+y2+'L'+(x+11)+' '+(y2-dir*18)+'Z',fill:'#fff',stroke:'rgba(10,20,26,.6)','stroke-width':1.5},g);
  const t=E('text',{x:x,y:ly,'text-anchor':'middle',class:'svgt'},g);t.textContent=label;return g;
}
SCENES.tr=(world,api)=>{
  const PER=300,XC=500,L=110,FMAX=60,V=9;
  let F=0,dl=0,dTarget=0,slipT=9,n=0,tt=0,cool=0,phase=0,rup=0;
  E('rect',{width:1000,height:560,fill:'var(--terr1)'},world);
  E('rect',{x:XC,width:500,height:560,fill:'var(--terr2)'},world);
  const sea=E('path',{d:'M0 0L120 0Q150 60 118 120Q92 190 128 260Q158 330 120 400Q96 470 130 560L0 560Z',fill:'var(--water)'},world);
  E('path',{d:'M120 0Q150 60 118 120Q92 190 128 260Q158 330 120 400Q96 470 130 560',fill:'none',stroke:'var(--water-deep)','stroke-width':3},world);
  const mk=(cls)=>({L:E('path',cls,world),R:E('path',cls,world)});
  const stream={L:E('path',{fill:'none',stroke:'var(--water-deep)','stroke-width':7,'stroke-linecap':'round'},world),R:E('path',{fill:'none',stroke:'var(--water-deep)','stroke-width':7,'stroke-linecap':'round'},world)};
  const fence={L:E('path',{fill:'none',stroke:'var(--ink)','stroke-width':3,'stroke-dasharray':'2 7','stroke-linecap':'round'},world),R:E('path',{fill:'none',stroke:'var(--ink)','stroke-width':3,'stroke-dasharray':'2 7','stroke-linecap':'round'},world)};
  const roadB={L:E('path',{fill:'none',stroke:'#4b4f55','stroke-width':10},world),R:E('path',{fill:'none',stroke:'#4b4f55','stroke-width':10},world)};
  const roadC={L:E('path',{fill:'none',stroke:'#f3e7a8','stroke-width':2,'stroke-dasharray':'9 9'},world),R:E('path',{fill:'none',stroke:'#f3e7a8','stroke-width':2,'stroke-dasharray':'9 9'},world)};
  const crack=E('path',{d:'M500 0L503 90L497 180L503 280L498 380L502 470L500 560',fill:'none',stroke:'#1a1a1d','stroke-width':4},world);
  const glow=E('path',{fill:'none',stroke:'var(--q1)','stroke-width':8,'stroke-linecap':'round',opacity:0},world);
  const rings=[0,1,2].map(()=>E('circle',{cx:XC,cy:320,r:0,fill:'none',stroke:'var(--q1)','stroke-width':4,opacity:0},world));
  const epi=E('circle',{cx:XC,cy:320,r:9,fill:'var(--q1)',stroke:'#fff','stroke-width':2,opacity:0},world);
  varrow(world,300,430,330,'Pacific Plate',302);varrow(world,720,130,230,'North American Plate',262);
  const cmp=E('text',{x:955,y:40,'text-anchor':'middle',class:'svgt d'},world);cmp.textContent='N';
  E('path',{d:'M955 50L955 78M948 58L955 48L962 58',stroke:'var(--ink)','stroke-width':3,fill:'none'},world);
  api.hud.innerHTML='<b>Stored strain</b><div class="meter"><i id="strm"></i></div><span id="trn"></span>';
  const strm=$('strm'),trn=$('trn');
  const rows=[];for(let k=-1;k<=3;k++)rows.push(k);
  function yU(x,side){const d=Math.abs(x-XC),U=F-(F-dl)*Math.exp(-d/L);return side<0?-U:U}
  function build(side,y0,wob){
    let d='';
    rows.forEach(k=>{
      let first=true;
      for(let x=side<0?0:XC;x<=(side<0?XC:1000);x+=10){
        const y=y0+PER*k+(wob?wob(x):0)+yU(x,side);
        d+=(first?'M':'L')+x+' '+y.toFixed(1);first=false;
      }
    });
    return d;
  }
  function cap(i){if(i===phase)return;phase=i;api.caption(i?'Slip! Elastic rebound':'The fault is locked',i?'The stuck rock snaps back to its relaxed shape and releases its stored energy as seismic waves. Notice the road, stream and fence are now broken and shifted across the fault.':'Both plates keep moving, but friction holds the fault. Watch the roads, stream and fence bend near the fault as strain builds up. This is time-lapse: each quake represents about 100 years of plate motion.')}
  api.caption('The fault is locked','Both plates keep moving, but friction holds the fault. Watch the roads, stream and fence bend near the fault as strain builds up. This is time-lapse: each quake represents about 100 years of plate motion.');
  function trigger(){dTarget=F;slipT=0;n++;rup=0;cool=3;cap(1);rings.forEach((r,i)=>r.setAttribute('data-d',i*.5));ringT=0}
  let ringT=9;
  function draw(){
    [['L',-1],['R',1]].forEach(([k,s])=>{
      roadB[k].setAttribute('d',build(s,60));roadC[k].setAttribute('d',build(s,60));
      stream[k].setAttribute('d',build(s,160,x=>14*Math.sin(x/55)));
      fence[k].setAttribute('d',build(s,240));
    });
  }
  draw();
  return {
    update(dt){
      tt+=dt;
      F+=V*dt;
      if(slipT<.55){slipT+=dt;const e=sstep(0,.55,slipT);dl=lerp(dl,dTarget,Math.min(1,dt*9))}
      else if(dTarget>dl)dl=dTarget;
      if(F>=PER){F-=PER;dl-=PER;dTarget-=PER}
      const strain=F-dl;
      if(strain>=FMAX&&slipT>=.55&&cool<=0)trigger();
      if(cool>0){cool-=dt;if(cool<=0)cap(0)}
      // glow + rings
      if(slipT<.9){rup=Math.min(1,slipT/.6);const reach=300*rup;glow.setAttribute('d','M500 '+(320-reach)+'L500 '+(320+reach));glow.setAttribute('opacity',(1-sstep(.5,.9,slipT)).toFixed(2));epi.setAttribute('opacity',1)}
      else{glow.setAttribute('opacity',0);epi.setAttribute('opacity',Math.max(0,epi.getAttribute('opacity')-dt*.5))}
      ringT+=dt;
      rings.forEach((r,i)=>{const a=ringT-i*.45;if(a>0&&a<2.6){const f=a/2.6;r.setAttribute('r',(10+f*360).toFixed(1));r.setAttribute('opacity',(.9*(1-f)).toFixed(2))}else r.setAttribute('opacity',0)});
      strm.style.width=(clamp(strain/FMAX,0,1)*100)+'%';
      trn.textContent='Earthquakes so far: '+n;
      draw();
    },
    action(){trigger()},
    controls(c){const b=document.createElement('button');b.type='button';b.className='btn primary';b.textContent='Release the fault now';
      b.onclick=()=>{if(F-dl<18){api.caption('Let strain build first','There is not enough stored strain yet. Wait for the meter to fill a little, then release the fault.');setTimeout(()=>{phase=-1;cap(0)},2500)}else trigger()};c.appendChild(b)}
  };
};

init();
</script>

</body>
